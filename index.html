<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070c17">
<title>SUPER TETRIS</title>
<style>
  :root {
    --bg: #070c17;
    --panel: rgba(15, 25, 45, 0.92);
    --panel-border: #253959;
    --accent: #4db2ff;
    --text: #eef4ff;
    --muted: #8fa6c9;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 15%, #111f3b 0%, #070c17 70%);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  #app {
    height: 100dvh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    padding: clamp(3px, 0.6vh, 8px) clamp(6px, 1.2vw, 18px);
    gap: clamp(3px, 0.5vh, 6px);
  }
  header {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    min-height: 26px;
    gap: 8px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #connection {
    font-size: clamp(10px, 1.3vh, 13px);
    color: var(--muted);
    text-align: right;
    line-height: 1.2;
  }
  .icon-btn {
    background: var(--panel);
    color: var(--text);
    border: 1.5px solid var(--panel-border);
    border-radius: 9px;
    padding: 4px 10px;
    font-size: clamp(11px, 1.35vh, 13px);
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  #area {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(8px, 1.6vw, 24px);
  }
  #wrap {
    height: 100%;
    max-height: 96dvh;
    aspect-ratio: 10 / 20;
    position: relative;
    background: #091120;
    border: 2.5px solid #3c5882;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.7), 0 0 28px rgba(77, 178, 255, 0.14);
  }
  canvas#board {
    display: block;
    width: 100%;
    height: 100%;
  }
  #side {
    width: clamp(108px, 22vw, 280px);
    height: 100%;
    max-height: 96dvh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: clamp(6px, 0.9vh, 12px);
  }
  .panel {
    background: var(--panel);
    border: 1.5px solid var(--panel-border);
    border-radius: 12px;
    padding: clamp(7px, 1.1vh, 14px) clamp(8px, 1.2vw, 16px);
  }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: clamp(5px, 0.8vh, 10px);
  }
  @media (min-width: 720px) and (orientation: landscape) {
    .stats-grid {
      grid-template-columns: 1fr 1fr;
    }
  }
  .lab {
    font-size: clamp(9px, 1.15vh, 12px);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
  }
  .val {
    font-size: clamp(15px, 2.5vh, 30px);
    font-weight: 900;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .pieces-box {
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.2vh, 14px);
  }
  .piece-slot {
    width: 100%;
  }
  .piece-canvas {
    display: block;
    width: 100%;
    height: clamp(54px, 9.5vh, 104px);
    background: #08101e;
    border: 1px solid #1d2f4d;
    border-radius: 8px;
    margin-top: 4px;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(4, 8, 18, 0.92);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 30;
  }
  .overlay.hide {
    display: none;
  }
  .dialog {
    width: min(94vw, 480px);
    max-height: 90dvh;
    overflow-y: auto;
    background: #101b30;
    border: 2px solid #39537d;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
  }
  .dialog h2 {
    margin: 0 0 12px;
    font-size: clamp(22px, 3.2vh, 30px);
    letter-spacing: 2px;
    font-weight: 900;
  }
  .dialog p {
    font-size: clamp(12px, 1.7vh, 16px);
    line-height: 1.45;
    color: #bfd0eb;
    margin: 6px 0 14px;
  }
  .dialog p.hide-desc {
    display: none;
  }
  .btn-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 8px;
  }
  button.action-btn {
    border: 0;
    border-radius: 10px;
    padding: 12px 20px;
    background: var(--accent);
    color: #06101f;
    font-size: clamp(14px, 1.8vh, 18px);
    font-weight: 900;
    cursor: pointer;
  }
  button.secondary-btn {
    border: 1.5px solid #3c5680;
    border-radius: 10px;
    padding: 11px 16px;
    background: #162542;
    color: #eef4ff;
    font-size: clamp(13px, 1.7vh, 16px);
    font-weight: 700;
    cursor: pointer;
  }
  button:focus, input:focus, select:focus {
    outline: none;
    box-shadow: 0 0 0 3.5px #ffffff, 0 0 16px var(--accent);
  }
  input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 2px solid #496184;
    background: #081120;
    color: white;
    font-size: 16px;
    margin: 8px 0;
    user-select: text;
  }
  #ranking {
    max-height: 24vh;
    overflow-y: auto;
    text-align: left;
    font-size: clamp(12px, 1.6vh, 15px);
    margin-top: 14px;
    background: #0a1222;
    border-radius: 10px;
    padding: 10px 12px;
  }
  .rankrow {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #1e2e4a;
  }
  .rankrow:last-child { border-bottom: 0; }

  .opt-section {
    text-align: left;
    margin-top: 12px;
    background: #0a1222;
    border: 1px solid #223554;
    border-radius: 12px;
    padding: 12px;
  }
  .opt-section h3 {
    margin: 0 0 8px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
  }
  .opt-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid #192842;
    gap: 8px;
    font-size: 14px;
  }
  .opt-row:last-child { border-bottom: 0; }
  .bind-btn {
    background: #172744;
    color: #eef4ff;
    border: 1.5px solid #395582;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 800;
    min-width: 118px;
    text-align: center;
    cursor: pointer;
  }
  .bind-btn.listening {
    background: #ffb84d;
    color: #08101d;
    border-color: #fff;
  }
  .toggle-btn {
    background: #172744;
    color: #eef4ff;
    border: 1.5px solid #395582;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }
  .toggle-btn.on {
    background: #28a768;
    border-color: #5ce09b;
    color: #04150c;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-right">
      <div id="connection">Aguardando controle</div>
      <button class="icon-btn" id="openOptions" title="Opções">⚙ OPÇÕES</button>
    </div>
  </header>

  <div id="area">
    <div id="wrap">
      <canvas id="board"></canvas>
    </div>

    <aside id="side">
      <div class="panel stats-grid">
        <div>
          <div class="lab">Pontuação</div>
          <div class="val" id="score">0</div>
        </div>
        <div>
          <div class="lab">Recorde</div>
          <div class="val" id="record">0</div>
        </div>
        <div>
          <div class="lab">Linhas</div>
          <div class="val" id="lines">0</div>
        </div>
        <div>
          <div class="lab">Nível</div>
          <div class="val" id="level">1</div>
        </div>
      </div>

      <div class="panel pieces-box">
        <div class="piece-slot">
          <div class="lab">Próxima</div>
          <canvas id="next" class="piece-canvas"></canvas>
        </div>
        <div class="piece-slot">
          <div class="lab">Guardada</div>
          <canvas id="holdCanvas" class="piece-canvas"></canvas>
        </div>
      </div>
    </aside>
  </div>
</div>

<div id="overlay" class="overlay">
  <div class="dialog">
    <h2 id="title">MENU</h2>
    <p id="message" class="hide-desc"></p>
    <div class="btn-row" id="mainBtns">
      <button class="action-btn" id="start" autofocus>COMEÇAR</button>
      <button class="secondary-btn" id="overlayOptions">⚙ OPÇÕES</button>
    </div>
    <div id="saveArea" hidden>
      <input id="player" maxlength="16" placeholder="Digite seu nome">
      <div class="btn-row">
        <button class="action-btn" id="save">SALVAR PONTUAÇÃO</button>
      </div>
    </div>
    <div id="ranking">
      <b>🏆 RANKING — TOP 10</b>
      <div id="rankingList"></div>
    </div>
  </div>
</div>

<div id="optionsModal" class="overlay hide">
  <div class="dialog">
    <h2>⚙ OPÇÕES DO JOGO</h2>

    <div class="opt-section">
      <h3>Áudio e Tela</h3>
      <div class="opt-row">
        <span>Efeitos Sonoros (SFX)</span>
        <button class="toggle-btn on" id="toggleSfx">ATIVADO</button>
      </div>
      <div class="opt-row">
        <span>Música de Fundo</span>
        <button class="toggle-btn on" id="toggleMusic">ATIVADA</button>
      </div>
      <div class="opt-row">
        <span>Peça Fantasma (Sombra)</span>
        <button class="toggle-btn on" id="toggleGhost">ATIVADA</button>
      </div>
    </div>

    <div class="opt-section">
      <h3>Comandos do Controle</h3>
      <p style="font-size:11px; margin:0 0 8px;">Selecione um comando e pressione o botão desejado no controle.</p>
      <div id="bindingsList"></div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="secondary-btn" id="resetBindings" style="font-size:12px; padding:8px 12px;">Restaurar Padrão</button>
      </div>
    </div>

    <div class="btn-row" style="margin-top:14px;">
      <button class="action-btn" id="closeOptions">CONCLUÍDO</button>
    </div>
  </div>
</div>

<script>
(() => {
  const C = 10, R = 20;
  const cv = document.getElementById('board'), g = cv.getContext('2d');
  const nc = document.getElementById('next'), ng = nc.getContext('2d');
  const hc = document.getElementById('holdCanvas'), hg = hc.getContext('2d');
  const $ = id => document.getElementById(id);

  const colors = {
    I: '#34e1f5', O: '#ffd93d', T: '#c27dff',
    S: '#57eb76', Z: '#ff5c77', J: '#5294ff', L: '#ffaa3b'
  };
  const forms = {
    I: [[1,1,1,1]],
    O: [[1,1],[1,1]],
    T: [[0,1,0],[1,1,1]],
    S: [[0,1,1],[1,1,0]],
    Z: [[1,1,0],[0,1,1]],
    J: [[1,0,0],[1,1,1]],
    L: [[0,0,1],[1,1,1]]
  };

  const baseLevel1Delay = 850;
  const minDropDelay = 1;

  function computeLevelFromLines(totalLines) {
    return Math.floor(Math.max(0, totalLines) / 20) + 1;
  }

  function getDropDelay() {
    return Math.max(minDropDelay, baseLevel1Delay - (level - 1));
  }

  const defaultBindings = {
    left:   { pad: 14, label: 'D-Pad Esquerda' },
    right:  { pad: 15, label: 'D-Pad Direita' },
    down:   { pad: 13, label: 'D-Pad Baixo' },
    rotate: { pad: 0,  label: 'Botão X (0)' },
    hard:   { pad: 1,  label: 'Botão ○ (1)' },
    hold:   { pad: 4,  label: 'Botão L1 (4)' },
    pause:  { pad: 9,  label: 'OPTIONS (9)' }
  };

  const actionNames = {
    left: 'Mover Esquerda',
    right: 'Mover Direita',
    down: 'Descer Rápido',
    rotate: 'Girar Peça',
    hard: 'Queda Total',
    hold: 'Guardar Peça',
    pause: 'Pausar / Voltar'
  };

  let settings = {
    sfx: true,
    music: true,
    ghost: true,
    bindings: JSON.parse(JSON.stringify(defaultBindings))
  };

  try {
    const saved = JSON.parse(localStorage.getItem('superTetrisPadSettings') || 'null');
    if (saved) {
      settings = { ...settings, ...saved, bindings: { ...defaultBindings, ...(saved.bindings || {}) } };
    }
  } catch (e) {}

  function saveSettings() {
    try { localStorage.setItem('superTetrisPadSettings', JSON.stringify(settings)); } catch (e) {}
  }

  let audioCtx = null, musicTimer = null, noteIdx = 0;
  const melody = [
    [659.25, 2], [493.88, 1], [523.25, 1], [587.33, 2], [523.25, 1], [493.88, 1],
    [440.00, 2], [440.00, 1], [523.25, 1], [659.25, 2], [587.33, 1], [523.25, 1],
    [493.88, 3], [523.25, 1], [587.33, 2], [659.25, 2],
    [523.25, 2], [440.00, 2], [440.00, 3], [0, 1]
  ];

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tone(freq, dur = 0.08, type = 'triangle', vol = 0.12, slide = 0) {
    if (!settings.sfx || !freq) return;
    ensureAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), now + dur);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + dur);
  }

  const sfx = {
    move: () => tone(240, 0.045, 'sine', 0.07),
    rotate: () => tone(440, 0.07, 'triangle', 0.11, 140),
    drop: () => tone(150, 0.09, 'sine', 0.14, -60),
    hard: () => tone(180, 0.13, 'sawtooth', 0.12, -110),
    hold: () => tone(330, 0.08, 'sine', 0.1, 90),
    clear: (linesCount) => {
      const base = linesCount === 4 ? [523, 659, 784, 1046] : [440, 554, 659];
      base.forEach((f, idx) => setTimeout(() => tone(f, 0.14, 'triangle', 0.14), idx * 55));
    },
    levelUp: () => [523, 659, 784, 987, 1046].forEach((f, idx) => setTimeout(() => tone(f, 0.12, 'square', 0.08), idx * 60)),
    over: () => [340, 290, 240, 180].forEach((f, idx) => setTimeout(() => tone(f, 0.22, 'sawtooth', 0.11, -30), idx * 140))
  };

  function startMusic() {
    stopMusic();
    if (!settings.music) return;
    ensureAudio();
    const step = () => {
      if (!playing || paused || !settings.music) return;
      const [freq, beats] = melody[noteIdx % melody.length];
      noteIdx++;
      if (freq > 0 && audioCtx) {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.035, now);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + beats * 0.17);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + beats * 0.17);
      }
      musicTimer = setTimeout(step, beats * 185);
    };
    step();
  }

  function stopMusic() {
    if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
  }

  function fitCanvas(canvas, drawFn) {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const rect = canvas.getBoundingClientRect();
    if (rect.width > 0 && rect.height > 0) {
      if (canvas === cv) {
        const cellPx = Math.max(1, Math.floor(Math.min(rect.width / C, rect.height / R) * dpr));
        canvas.width = cellPx * C;
        canvas.height = cellPx * R;
      } else {
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
      }
      if (drawFn) drawFn();
    }
  }

  function resizeCanvases() {
    fitCanvas(cv, null);
    fitCanvas(nc, drawNext);
    fitCanvas(hc, drawHold);
  }
  window.addEventListener('resize', resizeCanvases);

  function createEmptyBoard() {
    return Array.from({ length: R }, () => Array(C).fill(''));
  }

  let board = createEmptyBoard();
  let bag = [], p = null, n = null, held = null, holdOK = true;
  let score = 0, lines = 0, level = 1, playing = false, paused = false;
  let last = 0, timer = 0, padIndex = null, prev = [], repeat = {l: 0, r: 0, d: 0};
  let flashRows = [], flashTimer = 0, listeningAction = null;

  function updateOptionButtons() {
    const sfxBtn = $('toggleSfx');
    sfxBtn.textContent = settings.sfx ? 'ATIVADO' : 'DESATIVADO';
    sfxBtn.classList.toggle('on', settings.sfx);

    const musBtn = $('toggleMusic');
    musBtn.textContent = settings.music ? 'ATIVADA' : 'DESATIVADA';
    musBtn.classList.toggle('on', settings.music);

    const ghBtn = $('toggleGhost');
    ghBtn.textContent = settings.ghost ? 'ATIVADA' : 'DESATIVADA';
    ghBtn.classList.toggle('on', settings.ghost);
  }

  function renderBindings() {
    const list = $('bindingsList');
    list.innerHTML = Object.keys(actionNames).map(act => {
      const b = settings.bindings[act];
      const active = listeningAction === act;
      return `<div class="opt-row">
        <span>${actionNames[act]}</span>
        <button class="bind-btn ${active ? 'listening' : ''}" data-bind="${act}">
          ${active ? 'Pressione botão...' : b.label}
        </button>
      </div>`;
    }).join('');

    list.querySelectorAll('.bind-btn').forEach(btn => {
      btn.onclick = () => {
        listeningAction = btn.dataset.bind;
        renderBindings();
      };
    });
  }

  const RANK_KEY = 'tetrisPS4Ranks_v2';
  try { localStorage.removeItem('tetrisPS4Ranks'); } catch (e) {}

  function ranks() {
    try {
      const raw = JSON.parse(localStorage.getItem(RANK_KEY) || '[]');
      if (!Array.isArray(raw)) return [];
      return raw
        .filter(item => item && typeof item.score === 'number' && !Number.isNaN(item.score))
        .map(item => ({ name: String(item.name || 'Jogador').slice(0, 16), score: item.score }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 10);
    } catch (e) {
      return [];
    }
  }

  function persistRanks(list) {
    const clean = (Array.isArray(list) ? list : [])
      .filter(item => item && typeof item.score === 'number' && !Number.isNaN(item.score))
      .map(item => ({ name: String(item.name || 'Jogador').slice(0, 16), score: item.score }))
      .sort((a, b) => b.score - a.score)
      .slice(0, 10);
    try { localStorage.setItem(RANK_KEY, JSON.stringify(clean)); } catch (e) {}
    return clean;
  }

  function stats() {
    $('score').textContent = score.toLocaleString('pt-BR');
    $('lines').textContent = lines;
    $('level').textContent = level;
    $('record').textContent = (ranks()[0]?.score || 0).toLocaleString('pt-BR');
  }

  function shuffle() {
    let a = Object.keys(forms);
    for (let i = a.length - 1; i > 0; i--) {
      let j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    bag.push(...a);
  }

  function piece() {
    if (!bag.length) shuffle();
    let type = bag.shift(), m = forms[type].map(x => x.slice());
    return {type, m, x: Math.floor((C - m[0].length) / 2), y: 0};
  }

  function hit(q, dx = 0, dy = 0, m = q.m) {
    for (let y = 0; y < m.length; y++) {
      for (let x = 0; x < m[y].length; x++) {
        if (m[y][x]) {
          let xx = q.x + x + dx, yy = q.y + y + dy;
          if (xx < 0 || xx >= C || yy >= R || (yy >= 0 && board[yy][xx])) return true;
        }
      }
    }
    return false;
  }

  function spawn() {
    p = n || piece();
    n = piece();
    holdOK = true;
    drawNext();
    if (hit(p)) finish();
  }

  function startGame() {
    ensureAudio();
    board = createEmptyBoard();
    bag = []; n = piece(); p = null; held = null;
    score = lines = 0; level = 1; playing = true; paused = false; timer = 0; noteIdx = 0;
    drawHold();
    spawn();
    stats();
    $('overlay').classList.add('hide');
    resizeCanvases();
    last = performance.now();
    startMusic();
  }

  function togglePause() {
    if (!playing) return;
    paused = !paused;
    if (paused) {
      stopMusic();
      $('title').textContent = 'JOGO PAUSADO';
      $('message').textContent = '';
      $('message').classList.add('hide-desc');
      $('start').textContent = 'CONTINUAR';
      $('start').hidden = false;
      $('saveArea').hidden = true;
      $('overlay').classList.remove('hide');
      $('start').focus();
    } else {
      $('overlay').classList.add('hide');
      last = performance.now();
      startMusic();
    }
  }

  function lockPieceToBoard() {
    if (!p) return;

    while (!hit(p, 0, 1)) p.y++;

    const pieceSnapshot = {
      type: p.type,
      m: p.m.map(row => row.slice()),
      x: p.x,
      y: p.y
    };
    p = null;
    timer = 0;

    let hitAboveBoard = false;
    for (let y = 0; y < pieceSnapshot.m.length; y++) {
      for (let x = 0; x < pieceSnapshot.m[y].length; x++) {
        if (pieceSnapshot.m[y][x]) {
          const yy = pieceSnapshot.y + y;
          const xx = pieceSnapshot.x + x;
          if (yy < 0) hitAboveBoard = true;
          else if (yy >= 0 && yy < R && xx >= 0 && xx < C) board[yy][xx] = pieceSnapshot.type;
        }
      }
    }

    if (hitAboveBoard) {
      finish();
      return;
    }

    score += 1;

    let cleared = [];
    for (let y = R - 1; y >= 0; y--) {
      if (board[y].every(Boolean)) {
        cleared.push(y);
        board.splice(y, 1);
        board.unshift(Array(C).fill(''));
        y++;
      }
    }

    if (cleared.length) {
      const oldLevel = level;
      lines += cleared.length;
      score += cleared.length * 10;
      level = computeLevelFromLines(lines);
      flashRows = cleared;
      flashTimer = 180;
      sfx.clear(cleared.length);
      if (level > oldLevel) setTimeout(sfx.levelUp, 220);
    } else {
      sfx.drop();
    }

    spawn();
    stats();
  }

  function move(dx) {
    if (playing && !paused && p && !hit(p, dx, 0)) {
      p.x += dx;
      sfx.move();
    }
  }
  function soft() {
    if (!playing || paused || !p) return;
    if (!hit(p, 0, 1)) {
      p.y++;
      timer = 0;
      sfx.move();
    } else {
      lockPieceToBoard();
    }
    stats();
  }
  function hard() {
    if (!playing || paused || !p) return;
    while (!hit(p, 0, 1)) { p.y++; }
    sfx.hard();
    lockPieceToBoard();
    stats();
  }
  function rotate() {
    if (!playing || paused || !p) return;
    let m = p.m, rot = m[0].map((_, i) => m.map(r => r[i]).reverse());
    for (let k of [0, -1, 1, -2, 2]) {
      if (!hit(p, k, 0, rot)) { p.x += k; p.m = rot; sfx.rotate(); return; }
    }
  }
  function hold() {
    if (!playing || paused || !holdOK || !p) return;
    let old = p.type;
    if (held) {
      let t = held; held = old;
      let m = forms[t].map(r => r.slice());
      p = {type: t, m, x: Math.floor((C - m[0].length) / 2), y: 0};
      if (hit(p)) finish();
    } else {
      held = old;
      spawn();
    }
    holdOK = false;
    drawHold();
    sfx.hold();
  }

  function finish() {
    playing = false;
    p = null;
    stopMusic();
    sfx.over();
    $('title').textContent = 'FIM DE JOGO';
    $('message').innerHTML = 'Pontuação final: <b>' + score.toLocaleString('pt-BR') + '</b>';
    $('message').classList.remove('hide-desc');
    $('start').hidden = true;
    $('saveArea').hidden = false;
    $('player').value = '';
    $('overlay').classList.remove('hide');
    renderRanks();
    setTimeout(() => $('player').focus(), 80);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderRanks() {
    let a = ranks();
    $('rankingList').innerHTML = a.length
      ? a.slice(0, 10).map((v, i) => '<div class="rankrow"><span>' + (i + 1) + '. ' + escapeHtml(v.name) + '</span><b>' + Number(v.score).toLocaleString('pt-BR') + '</b></div>').join('')
      : '<p style="margin:4px 0;">Nenhuma pontuação salva.</p>';
  }

  function saveScore() {
    let a = ranks();
    a.push({name: $('player').value.trim() || 'Jogador', score});
    persistRanks(a);
    $('saveArea').hidden = true;
    $('start').hidden = false;
    $('start').textContent = 'JOGAR NOVAMENTE';
    $('message').textContent = '';
    $('message').classList.add('hide-desc');
    stats();
    renderRanks();
    setTimeout(() => $('start').focus(), 80);
  }

  function drawBlock(c, x, y, s, color, alpha = 1) {
    const isGhost = alpha < 1;
    const gap = isGhost ? Math.max(1.5, s * 0.06) : Math.max(1, Math.round(s * 0.035));
    const bx = x * s + gap;
    const by = y * s + gap;
    const bw = Math.max(2, s - gap * 2);
    const bh = Math.max(2, s - gap * 2);
    const rad = Math.max(2, Math.min(6, s * 0.12));

    c.save();
    c.globalAlpha = alpha;
    c.imageSmoothingEnabled = false;

    c.beginPath();
    c.roundRect(bx, by, bw, bh, rad);
    c.fillStyle = color;
    c.fill();

    if (!isGhost) {
      const grad = c.createLinearGradient(bx, by, bx, by + bh);
      grad.addColorStop(0, 'rgba(255,255,255,0.24)');
      grad.addColorStop(0.5, 'rgba(255,255,255,0.02)');
      grad.addColorStop(1, 'rgba(0,0,0,0.24)');
      c.fillStyle = grad;
      c.fill();

      c.lineWidth = Math.max(1, s * 0.035);
      c.strokeStyle = 'rgba(255,255,255,0.22)';
      c.stroke();
    } else {
      c.lineWidth = Math.max(1, s * 0.04);
      c.strokeStyle = color;
      c.stroke();
    }
    c.restore();
  }

  function draw() {
    const s = cv.width / C;
    g.fillStyle = '#091120';
    g.fillRect(0, 0, cv.width, cv.height);

    g.strokeStyle = 'rgba(42, 66, 105, 0.28)';
    g.lineWidth = Math.max(1, s * 0.025);
    for (let x = 1; x < C; x++) { g.beginPath(); g.moveTo(x * s, 0); g.lineTo(x * s, cv.height); g.stroke(); }
    for (let y = 1; y < R; y++) { g.beginPath(); g.moveTo(0, y * s); g.lineTo(cv.width, y * s); g.stroke(); }

    for (let y = 0; y < R; y++) {
      for (let x = 0; x < C; x++) {
        if (board[y][x]) drawBlock(g, x, y, s, colors[board[y][x]]);
      }
    }

    if (flashTimer > 0 && flashRows.length) {
      g.fillStyle = `rgba(255, 255, 255, ${(flashTimer / 180) * 0.55})`;
      flashRows.forEach(rowY => g.fillRect(0, rowY * s, cv.width, s));
    }

    if (p) {
      if (settings.ghost) {
        let ghost = {...p, y: p.y};
        while (!hit(ghost, 0, 1)) ghost.y++;
        for (let y = 0; y < ghost.m.length; y++) {
          for (let x = 0; x < ghost.m[y].length; x++) {
            if (ghost.m[y][x]) drawBlock(g, ghost.x + x, ghost.y + y, s, colors[ghost.type], 0.2);
          }
        }
      }
      for (let y = 0; y < p.m.length; y++) {
        for (let x = 0; x < p.m[y].length; x++) {
          if (p.m[y][x]) drawBlock(g, p.x + x, p.y + y, s, colors[p.type]);
        }
      }
    }
  }

  function drawPreviewPiece(canvas, ctx, type, alpha = 1) {
    ctx.fillStyle = '#08101e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!type || !forms[type]) {
      ctx.fillStyle = '#4b6388';
      ctx.font = `bold ${Math.max(14, Math.round(canvas.height * 0.28))}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('—', canvas.width / 2, canvas.height / 2);
      return;
    }
    const m = forms[type];
    const s = Math.max(6, Math.floor(Math.min(canvas.width / 4.8, canvas.height / 3.2)));
    const totalW = m[0].length * s;
    const totalH = m.length * s;
    const ox = Math.floor((canvas.width - totalW) / 2);
    const oy = Math.floor((canvas.height - totalH) / 2);
    for (let y = 0; y < m.length; y++) {
      for (let x = 0; x < m[y].length; x++) {
        if (m[y][x]) drawBlock(ctx, (ox + x * s) / s, (oy + y * s) / s, s, colors[type], alpha);
      }
    }
  }

  function drawNext() {
    drawPreviewPiece(nc, ng, n?.type, 1);
  }

  function drawHold() {
    drawPreviewPiece(hc, hg, held, holdOK ? 1 : 0.55);
  }

  function frame(t) {
    if (!last) last = t;
    let dt = Math.min(100, Math.max(0, t - last));
    last = t;
    if (flashTimer > 0) flashTimer = Math.max(0, flashTimer - dt);
    if (playing && !paused && p) {
      timer += dt;
      const delay = getDropDelay();
      while (timer >= delay && playing && !paused && p) {
        timer -= delay;
        if (!hit(p, 0, 1)) {
          p.y++;
        } else {
          lockPieceToBoard();
          break;
        }
      }
    }
    draw();
    requestAnimationFrame(frame);
  }

  function runAction(act) {
    if (act === 'left') move(-1);
    else if (act === 'right') move(1);
    else if (act === 'down') soft();
    else if (act === 'rotate') { if (!playing) startGame(); else rotate(); }
    else if (act === 'hard') hard();
    else if (act === 'hold') hold();
    else if (act === 'pause') { if (!playing) startGame(); else togglePause(); }
  }

  function rep(k, on, fn) {
    if (!on) { repeat[k] = 0; return; }
    if (repeat[k] === 0) { fn(); repeat[k] = 1; }
    else { repeat[k]++; if (repeat[k] > 9 && repeat[k] % 3 === 0) fn(); }
  }

  function pads() {
    let ps = navigator.getGamepads?.() || [];
    let gp = (padIndex !== null && ps[padIndex]) || Array.from(ps).find(Boolean);
    if (gp) {
      if (padIndex === null) {
        padIndex = gp.index;
        resizeCanvases();
      }
      $('connection').textContent = 'Controle conectado';
      let b = gp.buttons.map(x => x.pressed);

      if (listeningAction) {
        const pressedIdx = b.findIndex((val, idx) => val && !prev[idx]);
        if (pressedIdx !== -1) {
          settings.bindings[listeningAction].pad = pressedIdx;
          settings.bindings[listeningAction].label = `Botão ${pressedIdx}`;
          listeningAction = null;
          saveSettings();
          renderBindings();
          prev = b;
          requestAnimationFrame(pads);
          return;
        }
      }

      if ($('optionsModal').classList.contains('hide')) {
        const bind = settings.bindings;
        ['rotate', 'hard', 'hold', 'pause'].forEach(act => {
          const btnIdx = bind[act].pad;
          if (btnIdx !== null && b[btnIdx] && !prev[btnIdx]) runAction(act);
        });
        const lBtn = bind.left.pad, rBtn = bind.right.pad, dBtn = bind.down.pad;
        rep('l', (lBtn !== null && b[lBtn]) || (gp.axes[0] || 0) < -0.65, () => move(-1));
        rep('r', (rBtn !== null && b[rBtn]) || (gp.axes[0] || 0) > 0.65, () => move(1));
        rep('d', (dBtn !== null && b[dBtn]) || (gp.axes[1] || 0) > 0.65, soft);
      }
      prev = b;
    } else if (padIndex !== null) {
      padIndex = null;
      $('connection').textContent = 'Controle desconectado';
      resizeCanvases();
    }
    requestAnimationFrame(pads);
  }

  window.addEventListener('gamepadconnected', e => {
    padIndex = e.gamepad.index;
    $('connection').textContent = 'Controle conectado';
    resizeCanvases();
  });

  $('start').onclick = () => { if (paused) togglePause(); else startGame(); };
  $('save').onclick = saveScore;
  $('player').addEventListener('keydown', e => { if (e.key === 'Enter') saveScore(); });

  const openOpts = () => {
    if (playing && !paused) togglePause();
    updateOptionButtons();
    renderBindings();
    $('optionsModal').classList.remove('hide');
    $('closeOptions').focus();
  };
  $('openOptions').onclick = openOpts;
  $('overlayOptions').onclick = openOpts;
  $('closeOptions').onclick = () => {
    listeningAction = null;
    $('optionsModal').classList.add('hide');
  };

  $('toggleSfx').onclick = () => {
    settings.sfx = !settings.sfx;
    if (settings.sfx) sfx.rotate();
    saveSettings();
    updateOptionButtons();
  };
  $('toggleMusic').onclick = () => {
    settings.music = !settings.music;
    saveSettings();
    updateOptionButtons();
  };
  $('toggleGhost').onclick = () => {
    settings.ghost = !settings.ghost;
    saveSettings();
    updateOptionButtons();
  };
  $('resetBindings').onclick = () => {
    settings.bindings = JSON.parse(JSON.stringify(defaultBindings));
    listeningAction = null;
    saveSettings();
    renderBindings();
  };

  $('title').textContent = 'MENU';
  $('message').textContent = '';
  $('message').classList.add('hide-desc');
  updateOptionButtons();
  resizeCanvases();
  stats();
  renderRanks();
  $('start').focus();
  requestAnimationFrame(frame);
  requestAnimationFrame(pads);
})();
</script>
</body>
</html>
